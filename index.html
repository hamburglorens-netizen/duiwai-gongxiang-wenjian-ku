<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>对外共享文件库</title>
  <style>
    :root { color-scheme: light; --ink:#18202a; --muted:#667085; --line:#e7e9ef; --blue:#1463ff; --bg:#f7f9fc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 980px; margin: 0 auto; padding: 32px 18px 56px; }
    header { padding: 26px; border-radius: 24px; background: linear-gradient(135deg, #13243e, #1463ff); color: white; box-shadow: 0 18px 48px rgba(20,99,255,.20); }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 48px); letter-spacing: -.04em; }
    header p { margin: 0; opacity: .86; }
    .tools { margin: 18px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input { flex: 1; min-width: 240px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 15px; background: white; }
    .count { color: var(--muted); font-size: 14px; }
    .list { display: grid; gap: 12px; }
    .card { display: grid; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: white; box-shadow: 0 10px 24px rgba(16,24,40,.05); }
    .card h2 { margin: 0; font-size: 18px; line-height: 1.3; }
    .meta { color: var(--muted); font-size: 13px; }
    a.button { width: fit-content; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 9px 13px; background: var(--blue); color: white; font-weight: 800; text-decoration: none; }
    .empty { padding: 30px; border: 1px dashed #cfd5df; border-radius: 18px; color: var(--muted); background: white; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>对外共享文件库</h1>
    <p>3016 旅游工作台生成的公开 HTML 文件索引。手机、QQ、微信、浏览器均可通过 HTTPS 访问。</p>
  </header>
  <div class="tools">
    <input id="q" placeholder="搜索文件名 / 标题" />
    <span class="count" id="count">加载中…</span>
  </div>
  <section class="list" id="list"></section>
</main>
<script>
const list = document.getElementById('list');
const q = document.getElementById('q');
const count = document.getElementById('count');
let files = [];
function render(){
  const kw = q.value.trim().toLowerCase();
  const rows = files.filter(x => !kw || `${x.title||''} ${x.path||''}`.toLowerCase().includes(kw));
  count.textContent = `${rows.length} 个文件`;
  list.innerHTML = rows.length ? rows.map(x => `
    <article class="card">
      <h2>${escapeHtml(x.title || x.path)}</h2>
      <div class="meta">${escapeHtml(x.createdAt || '')} · ${escapeHtml(x.path || '')}</div>
      <a class="button" href="${encodeURI(x.path)}">打开 HTML</a>
    </article>`).join('') : '<div class="empty">暂无公开文件。</div>';
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
fetch('shared-files.json', {cache:'no-store'}).then(r => r.json()).then(data => { files = Array.isArray(data) ? data : []; render(); }).catch(() => { count.textContent='清单读取失败'; render(); });
q.addEventListener('input', render);
</script>
</body>
</html>
